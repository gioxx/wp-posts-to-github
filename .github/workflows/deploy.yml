name: Deploy to WordPress.org Repository

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.5.12)'
        required: true

permissions:
  contents: read

jobs:
  deploy_to_wp_repository:
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    # release.yml uses the default GITHUB_TOKEN to create its tag/release, and
    # token-authored events don't cascade to other workflows, so this can't
    # listen on `release: released` directly - it reacts to the Release run instead.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 '^ \* Version:' post-to-github-md.php | sed -E 's/.*Version:\s*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build clean plugin directory
        run: |
          SLUG=post-to-github-md
          STAGING="/tmp/$SLUG"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          git ls-files \
            | grep -v '^tests/' \
            | grep -v '^phpunit\.xml\.dist$' \
            | grep -v '^\.github/' \
            | grep -v '^\.gitignore$' \
            | grep -v '^vendor/' \
            | grep -v '^README\.it\.md$' \
            | rsync -a --files-from=- . "$STAGING/"
          cp -r vendor "$STAGING/vendor"
          find "$STAGING/vendor" -type d -name bin -prune -exec rm -rf {} +
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: posts-to-github-md
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ env.STAGING }}
